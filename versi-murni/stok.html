<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#312E81">
  <title>Manajemen Stok | Brahamart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/products.css">
  <link rel="stylesheet" href="assets/css/stock.css">
</head>
<body class="products-page stock-page">
  <div class="products-app">
    <aside class="products-sidebar" id="products-sidebar">
      <a class="products-brand" href="dashboard.html" aria-label="Brahamart, kembali ke dashboard">
        <span class="products-brand__icon" aria-hidden="true"><img src="assets/img/Brahamart_keranjang-removebg-preview.png" alt=""></span>
        <span>Brahamart</span>
      </a>
      <nav class="products-nav" aria-label="Navigasi utama">
        <a class="products-nav__link" href="dashboard.html" data-admin-only>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="products-nav__link" href="kasir.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8m-8 4h2m4 0h2m-8 4h2m4 0h2m-8 3h8"/></svg>
          <span>Kasir</span>
        </a>
        <a class="products-nav__link" href="produk.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5 12 3l8 2.5v13L12 21l-8-2.5z"/><path d="m4.5 6 7.5 2.5L19.5 6M12 9v11"/></svg>
          <span>Produk</span>
        </a>
        <a class="products-nav__link is-active" href="stok.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 8h16M9 12h6m-6 4h6"/></svg>
          <span>Stok</span>
        </a>
        <a class="products-nav__link" href="riwayat.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8"/><path d="M3 3v5h5m4-1v5l3 2"/></svg>
          <span>Riwayat</span>
        </a>
        <a class="products-nav__link" href="laporan.html" data-admin-only>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V12m5 8V7m5 13V4m5 16v-9"/></svg>
          <span>Laporan</span>
        </a>
        <a class="products-nav__link" href="pengguna.html" data-admin-only>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0m2-9a3 3 0 1 0 0-6m1 9a5 5 0 0 1 3 4.5"/></svg>
          <span>Pengguna</span>
        </a>
        <a class="products-nav__link" href="pengaturan.html" data-admin-only>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 1-1.5 2.6-1.5-.6a8 8 0 0 1-1.6.9l-.3 1.6h-3l-.3-1.6a8 8 0 0 1-1.6-.9l-1.5.6-1.5-2.6 1.2-1a7 7 0 0 1 0-1.9l-1.2-1 1.5-2.6 1.5.6a8 8 0 0 1 1.6-.9l.3-1.6h3l.3 1.6a8 8 0 0 1 1.6.9l1.5-.6 1.5 2.6-1.2 1a7 7 0 0 1 0 1.9z"/></svg>
          <span>Pengaturan</span>
        </a>
      </nav>
      <div class="products-sidebar__hint" id="sidebar-hint">
        <strong>Manajemen Stok</strong>
        <span>Pantau ketersediaan dan catat setiap perubahan persediaan.</span>
      </div>
      <div class="products-profile">
        <span class="avatar avatar--sidebar" id="sidebar-avatar" aria-hidden="true">AD</span>
        <span class="products-profile__info"><strong id="sidebar-name">Admin</strong><span id="sidebar-role">Administrator</span></span>
        <button class="products-profile__logout" type="button" id="logout-btn" aria-label="Keluar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
        </button>
      </div>
    </aside>
    <div class="products-backdrop" id="products-backdrop" hidden></div>
    <div class="products-main">
      <header class="products-topbar">
        <button class="products-menu-toggle" id="menu-toggle" type="button" aria-label="Buka navigasi" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <strong>Sistem Kasir Minimarket</strong>
        <span class="products-topbar__date" id="current-date"></span>
        <div class="products-topbar__user">
          <span><strong id="header-name">Admin</strong><small id="role-badge">Admin</small></span>
          <span class="avatar" id="user-avatar" aria-hidden="true">AD</span>
        </div>
      </header>
      <main class="products-content stock-content" id="stock-main" tabindex="-1"></main>
    </div>
  </div>
  <div class="products-toast" id="stock-toast" role="status" aria-live="polite" hidden></div>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/product-store.js"></script>
  <script src="assets/js/stock.js"></script>
</body>
</html>
